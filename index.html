<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Tênis e Sneakers Online</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">

  <link rel="stylesheet" href="./css/components/header.css">
</head>

<body>
  <header class="header">
    <h1 class="logo">
      <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
        <img src="./images/logo/logo.svg" alt="SyntaxWear - Tênis e Sneakers Online">
      </a>
    </h1>

    <nav class="nav-center" aria-label="Categorias principais">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul>
    </nav>

    <nav class="nav-right" aria-label="Acesso rápido">
      <ul>
        <li>
          <a href="#">Nossas lojas</a>
        </li>
        <li>
          <a href="#">Sobre</a>
        </li>
        <li>
          <a href="#" aria-label="Minha conta">
            <img src="./images/icons/user.svg" alt="Minha conta" />
          </a>
        </li>
        <li>
          <a href="#" aria-label="Ajuda">
            <img src="./images/icons/help.svg" alt="Ajuda" />
          </a>
        </li>
        <li>
          <a href="#" aria-label="Carrinho">
            <img src="./images/icons/bag.svg" alt="Carrinho" />
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Destaque principal"></section>

    <section class="shoe-categories" aria-labelledby="categories-title">
      <h2 id="categories-title">Categorias</h2>
      <div class="category-grid"></div>
    </section>

    <section class="featured-products" aria-labelledby="featured-title">
      <h2 id="featured-title">Produtos em destaque</h2>
      <div class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <section class="footer-contact" aria-label="Informações de contato"></section>
    <nav class="footer-links" aria-label="Links do rodapé">
      <ul></ul>
    </nav>
  </footer>
</body>

</html>
