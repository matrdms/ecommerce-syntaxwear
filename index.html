<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Ecommerce</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>

<body>
  <header class="site-header">
    <a class="site-logo" href="/" aria-label="SyntaxWear - página inicial"></a>
    <nav class="main-navigation" aria-label="Navegação principal">
      <ul></ul>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Destaque principal"></section>

    <section class="shoe-categories" aria-labelledby="categories-title">
      <h2 id="categories-title">Categorias</h2>
      <div class="category-grid"></div>
    </section>

    <section class="featured-products" aria-labelledby="featured-title">
      <h2 id="featured-title">Produtos em destaque</h2>
      <div class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <section class="footer-contact" aria-label="Informações de contato"></section>
    <nav class="footer-links" aria-label="Links do rodapé">
      <ul></ul>
    </nav>
  </footer>
</body>
</html>
